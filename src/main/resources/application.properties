spring.application.name=ppm-backend
server.port=8082
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/db_ppm
spring.datasource.username=postgres
spring.datasource.password=hjclomba10
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

ppm.capacity.thresholds.ok=80
ppm.capacity.thresholds.conditioned=100
ppm.capacity.thresholds.restricted=120

# Acesso às demandas por direção. Ligar só depois de os perfis/transactions estarem no hub e as
# direções atribuídas em "Utilizadores por Direção"; com false tudo funciona como antes.
ppm.access.direction-filter.enabled=true
# Exige a transaction admin_utilizadores_direcao em /user-directions e /department-mappings.
ppm.access.admin-guard.enabled=true
